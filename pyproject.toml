[project]
name = "learning-tracker"
version = "0.1.0"
description = "Self-hostable morning reading lists: three checked links a day for topics you choose."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.17.0",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["uv_build==0.12.24"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["learning_tracker", "tests", "tools"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]  # tests may assert and call git

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "tools"]
