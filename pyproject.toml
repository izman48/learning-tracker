[project]
name = "learning-tracker"
version = "0.1.0"
description = "Self-hostable morning reading lists: three checked links a day for topics you choose."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp==3.14.4",
    "alembic==1.20.0",
    "fastapi==0.143.0",
    "fastapi-users==15.0.5",
    "psycopg[binary]==3.3.6",
    "publicsuffixlist==1.1.0.20261010",
    "sqlalchemy[asyncio]==2.1.4",
    "uvicorn==0.54.0",
    "yarl==1.25.1",
]

[project.scripts]
lt = "learning_tracker.cli:main"

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.17.0",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["uv_build==0.12.24"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["learning_tracker", "tests", "tools"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S603", "S607"]  # asserts, fake credentials, git calls

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "tools"]
